version: '3.8'

services:
  api:
    build: .
    container_name: dsci28_fastapi
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/EHCVM_Project/EHCVM_Project:/app
    restart: unless-stopped

  dashboard:
    build: .
    container_name: dsci28_streamlit
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/EHCVM_Project/EHCVM_Project:/app
    depends_on:
      - api
    restart: unless-stopped
